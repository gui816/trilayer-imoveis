<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Back-office · TriLayer Imóveis</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#faf8f4;color:#2a2520;line-height:1.6;padding:2rem 1.2rem}
h1{font-size:1.3rem;margin-bottom:.4rem}
.sub{color:#6f675c;font-size:.85rem;margin-bottom:1.6rem}
#login{max-width:380px;margin:8vh auto;background:#fff;border:1px solid rgba(42,37,32,.1);border-radius:14px;padding:2rem}
#login h2{font-size:1rem;margin-bottom:1rem}
input{width:100%;background:#f2eee6;border:1px solid rgba(42,37,32,.1);border-radius:9px;padding:.75rem 1rem;font-size:.92rem;outline:none;margin-bottom:.9rem}
button{background:#176b57;color:#fff;border:none;border-radius:9px;padding:.8rem 1.3rem;font-weight:600;font-size:.9rem;cursor:pointer}
button:hover{background:#125548}
.err{color:#c0392b;font-size:.8rem;min-height:1.2em}
#app{display:none;max-width:1100px;margin:0 auto}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:2rem}
.t{background:#fff;border:1px solid rgba(42,37,32,.1);border-radius:12px;padding:1.1rem 1.3rem}
.t .k{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6f675c}
.t .v{font-family:'Georgia',serif;font-size:1.5rem;margin-top:.2rem}
.card{background:#fff;border:1px solid rgba(42,37,32,.1);border-radius:14px;padding:1.4rem;margin-bottom:1.6rem}
.card h3{font-size:.95rem;margin-bottom:1rem}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid rgba(42,37,32,.07)}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:#6f675c}
.badge{display:inline-block;background:rgba(23,107,87,.12);color:#176b57;border-radius:99px;padding:.15rem .6rem;font-size:.72rem;font-weight:700}
.badge.off{background:rgba(192,57,43,.1);color:#c0392b}
.muted{color:#6f675c}
@media(max-width:640px){th:nth-child(n+3),td:nth-child(n+3){display:none}}
</style>
</head>
<body>

<div id="login">
  <h2>🔐 Back-office · TriLayer Imóveis</h2>
  <input id="pw" type="password" placeholder="Password de acesso"/>
  <div class="err" id="err"></div>
  <button onclick="login()">Entrar</button>
</div>

<div id="app">
  <h1>Back-office · TriLayer Imóveis</h1>
  <div class="sub">Passes com validade (Stripe) — contas, compras e receita.</div>

  <div class="totals" id="totals"></div>

  <div class="card">
    <h3>Contas</h3>
    <table>
      <thead><tr><th>Utilizador</th><th>Criada</th><th>Passe</th><th>Válido até</th><th>Usos hoje</th></tr></thead>
      <tbody id="users"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>Compras</h3>
    <table>
      <thead><tr><th>Data</th><th>Utilizador</th><th>Plano</th><th>Valor</th><th>Fatura</th></tr></thead>
      <tbody id="purchases"></tbody>
    </table>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

async function login(){
  const r = await fetch("/api/backoffice/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({password: $("pw").value})
  });
  const j = await r.json().catch(() => ({}));
  if(!r.ok){ $("err").textContent = j.detail || "Erro."; return; }
  sessionStorage.setItem("bo_token", j.token);
  load();
}

async function load(){
  const tok = sessionStorage.getItem("bo_token");
  if(!tok) return;
  const r = await fetch("/api/backoffice/data", {headers: {"X-Token": tok}});
  if(r.status === 401){ sessionStorage.removeItem("bo_token"); $("app").style.display = "none"; $("login").style.display = "block"; return; }
  const j = await r.json();
  $("login").style.display = "none";
  $("app").style.display = "block";

  const t = j.totals;
  $("totals").innerHTML = `
    <div class="t"><div class="k">Receita</div><div class="v">${(t.receita_cents/100).toFixed(2).replace(".", ",")} €</div></div>
    <div class="t"><div class="k">Passes ativos</div><div class="v">${t.passes_ativos}</div></div>
    <div class="t"><div class="k">Contas</div><div class="v">${t.contas}</div></div>
    <div class="t"><div class="k">Dispositivos demo hoje</div><div class="v">${t.demo_dispositivos}</div></div>`;

  $("users").innerHTML = j.users.map(u => `
    <tr>
      <td>${u.user}</td>
      <td class="muted">${u.created || "—"}</td>
      <td>${u.pass_type ? `<span class="badge">${u.pass_type}</span>` : `<span class="badge off">sem passe</span>`}</td>
      <td class="muted">${u.valid_until || "—"}</td>
      <td class="muted">${u.usos_hoje}</td>
    </tr>`).join("");

  $("purchases").innerHTML = j.purchases.map(p => `
    <tr>
      <td class="muted">${p.created || "—"}</td>
      <td>${p.user}</td>
      <td><span class="badge">${p.plan}</span></td>
      <td>${(p.amount_cents/100).toFixed(2).replace(".", ",")} €</td>
      <td><button class="btn-sm" onclick="invoicePdf('${p.session}')">PDF</button></td>
    </tr>`).join("") || `<tr><td colspan="5" class="muted">Sem compras ainda.</td></tr>`;
}

async function invoicePdf(session){
  const tok = sessionStorage.getItem("bo_token");
  const r = await fetch("/api/backoffice/invoice?session_id=" + encodeURIComponent(session), {headers: {"X-Token": tok}});
  if(!r.ok){
    const j = await r.json().catch(() => ({}));
    alert("Erro: " + (j.detail || r.status));
    return;
  }
  const blob = await r.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "fatura-recibo.pdf";
  a.click();
  URL.revokeObjectURL(a.href);
}

$("pw").addEventListener("keydown", e => { if(e.key === "Enter") login(); });
if(sessionStorage.getItem("bo_token")) load();
</script>
</body>
</html>
