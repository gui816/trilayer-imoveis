services:
  - type: web
    name: trilayer-imoveis-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_USER
        value: gui
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SITE_URL
        value: https://gui816.github.io/trilayer-imoveis/
      - key: BACKOFFICE_PASSWORD
        sync: false
      - key: MAX_ACTIVE_SESSIONS
        value: "1"
      - key: DEMO_LIMIT_PER_DAY
        value: "2"
      - key: DEMO_IP_LIMIT_PER_DAY
        value: "10"
      - key: TZ
        value: Europe/Lisbon
