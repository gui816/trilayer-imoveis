services:
  - type: web
    name: trilayer-imoveis-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_USER
        value: gui
      - key: ADMIN_PASSWORD
        sync: false
      - key: LIMIT_PER_DAY
        value: "20"
      - key: LIMIT_PER_WEEK
        value: "50"
      - key: LIMIT_PER_MONTH
        value: "200"
      - key: MAX_ACTIVE_SESSIONS
        value: "1"
      - key: DEMO_LIMIT_PER_DAY
        value: "1"
      - key: DEMO_IP_LIMIT_PER_DAY
        value: "2"
