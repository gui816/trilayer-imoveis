services:
  - type: web
    name: trilayer-imoveis-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_USER
        value: gui
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SITE_URL
        value: https://gui816.github.io/trilayer-imoveis/
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGINS
        value: "https://gui816.github.io,http://localhost:5500,http://127.0.0.1:5500,null"
      - key: MAX_ACTIVE_SESSIONS
        value: "1"
      - key: DEMO_LIMIT_PER_DAY
        value: "2"
      - key: DEMO_IP_LIMIT_PER_DAY
        value: "10"
      - key: TZ
        value: Europe/Lisbon
      - key: FATURA_NOME
        sync: false
      - key: FATURA_NIF
        sync: false
      - key: FATURA_MORADA
        sync: false
      - key: FATURA_CAE
        value: "62090"
      - key: FATURA_ISENTO
        value: "1"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "TriLayer Imóveis <onboarding@resend.dev>"
      - key: CRON_SECRET
        sync: false
